<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="300" height="210">
  <defs>
    <radialGradient id="screenglow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#c9a7ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#241536" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="298" height="208" rx="18" fill="#0a0014" stroke="#3d2a5c" stroke-width="1.5"/>

  <!-- floating stars -->
  <g fill="#c9a7ff">
    <g transform="translate(40,28) rotate(45)">
      <rect x="-3" y="-3" width="6" height="6"/>
      <animateTransform attributeName="transform" type="translate" values="40,28;40,22;40,28" dur="3.6s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(255,22)">
      <rect x="-2" y="-2" width="4" height="4"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(230,155)">
      <rect x="-2" y="-2" width="4" height="4"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- desk -->
  <rect x="14" y="146" width="272" height="9" fill="#3d2a5c"/>

  <!-- character: head -->
  <g>
    <rect x="28" y="88" width="9" height="4" fill="#241536"/>
    <rect x="26" y="92" width="24" height="20" fill="#c9a7ff"/>
    <rect x="26" y="88" width="24" height="6" fill="#8b5cf6"/>
    <!-- blinking eye -->
    <rect x="40" y="100" width="4" height="4" fill="#241536">
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.92;0.95;0.98;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- body -->
    <rect x="24" y="112" width="30" height="34" fill="#8b5cf6"/>
    <!-- arm to keyboard -->
    <rect x="50" y="128" width="20" height="7" fill="#8b5cf6"/>
  </g>

  <!-- monitor -->
  <rect x="108" y="58" width="92" height="66" rx="4" fill="#241536" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="115" y="65" width="78" height="48" fill="#150822"/>
  <rect x="115" y="65" width="78" height="48" fill="url(#screenglow)">
    <animate attributeName="opacity" values="0.6;1;0.6;0.9;0.6" keyTimes="0;0.25;0.4;0.7;1" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="122" y="72" width="30" height="3" fill="#ff9cee" opacity="0.85"/>
  <rect x="122" y="79" width="46" height="3" fill="#c9a7ff" opacity="0.7"/>
  <rect x="122" y="86" width="20" height="3" fill="#ff9cee" opacity="0.85"/>
  <rect x="122" y="93" width="38" height="3" fill="#c9a7ff" opacity="0.55"/>
  <rect x="147" y="124" width="14" height="9" fill="#241536"/>
  <rect x="132" y="133" width="44" height="6" fill="#241536"/>
  <rect x="112" y="140" width="88" height="6" fill="#150822"/>

  <!-- coffee cup with steam -->
  <g transform="translate(70,120)">
    <rect x="0" y="10" width="16" height="14" rx="2" fill="#ff6ac2"/>
    <rect x="16" y="14" width="5" height="6" fill="none" stroke="#ff6ac2" stroke-width="2"/>
    <path d="M4,8 q-3,-6 0,-10" stroke="#c9a7ff" stroke-width="2" fill="none" opacity="0.7">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,4;0,-6" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M10,8 q3,-6 0,-10" stroke="#c9a7ff" stroke-width="2" fill="none" opacity="0.7">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,4;0,-6" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
