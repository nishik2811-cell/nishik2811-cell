<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 70" width="200" height="70">
  <rect x="1" y="1" width="198" height="68" rx="16" fill="#0a0014" stroke="#3d2a5c" stroke-width="1.5"/>
  <g fill="#c9a7ff">
    <rect x="30" y="16" width="3" height="3"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="165" y="20" width="2" height="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" begin="0.7s" repeatCount="indefinite"/></rect>
    <rect x="150" y="50" width="2" height="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.1s" begin="1.2s" repeatCount="indefinite"/></rect>
  </g>
  <text x="100" y="40" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#c9a7ff">connection closed</text>
  <rect x="180" y="30" width="10" height="16" fill="#ff6ac2">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
