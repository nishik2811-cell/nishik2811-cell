<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="scanline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff9cee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- CRT collapse: scanline shrinks to a point -->
  <rect x="20" y="58" width="360" height="4" rx="2" fill="url(#scanline-grad)">
    <animate attributeName="width"
      values="360;0;0"
      keyTimes="0;0.0833;1"
      dur="6.0s" repeatCount="indefinite"/>
    <animate attributeName="x"
      values="20;200;200"
      keyTimes="0;0.0833;1"
      dur="6.0s" repeatCount="indefinite"/>
  </rect>

  <!-- bright center dot flash after collapse -->
  <circle cx="200" cy="60" r="4" fill="#ff9cee">
    <animate attributeName="opacity"
      values="0;0;1;0;0"
      keyTimes="0;0.0833;0.0867;0.1333;1"
      dur="6.0s" repeatCount="indefinite"/>
  </circle>

  <!-- sign-off text, doubles as the linkedin cta -->
  <text x="200" y="66" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#c9a7ff">
    say hi on linkedin <tspan fill="#ff6ac2">&#9825;</tspan>
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.2167;0.2833;0.7833;0.8333;1"
      dur="6.0s" repeatCount="indefinite"/>
  </text>

  <!-- blinking cursor beneath, alive while the sign-off is visible -->
  <g>
    <animate attributeName="opacity"
      calcMode="discrete"
      values="0;1;0"
      keyTimes="0;0.2833;0.7833"
      dur="6.0s" repeatCount="indefinite"/>
    <rect x="192" y="82" width="16" height="3" fill="#ff6ac2">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
